services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resguardo
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco123
    ports:
      - "5435:5432"
    volumes:
      - datos-resguardo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco -d resguardo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/resguardo
      DB_USUARIO: banco
      DB_CLAVE: banco123
      JWT_CLAVE: ${JWT_CLAVE:?Falta JWT_CLAVE. Creen el archivo .env con JWT_CLAVE=una-clave-de-32-bytes-o-mas}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos-resguardo: